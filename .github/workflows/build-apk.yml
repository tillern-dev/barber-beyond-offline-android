name: Build Android APK
on:
  push:
    branches: [main, 'preview/v1.5-dashboard-settings', 'feature/booking-inbox-v1.6', 'feature/luminous-booking-ui-v1.6.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - name: Verify debug APK signing, alignment and compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOLS_DIR="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS_DIR/apksigner" verify --verbose --print-certs --min-sdk-version 30 "$APK"
          "$TOOLS_DIR/zipalign" -c -v 4 "$APK"
          "$TOOLS_DIR/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|native-code:)"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: barber-beyond-v1-6-1-LUMINOUS-PREVIEW-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
